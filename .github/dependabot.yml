# Atualizações automáticas de dependências.
# Correções de segurança chegam assim que publicadas; o restante, uma vez por
# semana, agrupado em um PR por ecossistema para não poluir o repositório.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      timezone: America/Cuiaba
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      timezone: America/Cuiaba
    open-pull-requests-limit: 5
    groups:
      worker-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Cuiaba
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
