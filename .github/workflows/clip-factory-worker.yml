name: Clip Factory Worker

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL"
        required: true
        type: string
      count:
        description: "Number of clips"
        required: false
        default: "5"
        type: string
      min_duration:
        description: "Minimum clip duration in seconds"
        required: false
        default: "20"
        type: string
      max_duration:
        description: "Maximum clip duration in seconds"
        required: false
        default: "60"
        type: string
  repository_dispatch:
    types: [clip-factory-job]

permissions:
  contents: read
  actions: read

concurrency:
  group: clip-factory-worker-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CLIP_FACTORY_DATA_DIR: ${{ github.workspace }}/worker/data
      WHISPER_MODEL: small
      RENDER: "false"
      JOB_ID: ${{ github.event.client_payload.job_id || github.run_id }}
      VIDEO_URL: ${{ github.event.client_payload.url || inputs.url }}
      COUNT: ${{ github.event.client_payload.count || inputs.count || '5' }}
      MIN_DURATION: ${{ github.event.client_payload.min_duration || inputs.min_duration || '20' }}
      MAX_DURATION: ${{ github.event.client_payload.max_duration || inputs.max_duration || '60' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl unzip ca-certificates libgomp1

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install YouTube PO token provider
        run: |
          git clone --depth 1 --branch 2.0.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          cd "$RUNNER_TEMP/bgutil-ytdlp-pot-provider/server"
          deno install --allow-scripts=npm:canvas --frozen
          nohup deno run --allow-env --allow-net --allow-ffi=. --allow-read=. src/main.ts > "$RUNNER_TEMP/bgutil-provider.log" 2>&1 &
          sleep 5
          pgrep -af "bgutil|src/main.ts" || (cat "$RUNNER_TEMP/bgutil-provider.log" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.txt
          python -m pip install -U bgutil-ytdlp-pot-provider

      - name: Show runner resources
        run: |
          free -h
          df -h
          ffmpeg -version | head -n 1
          yt-dlp --version
          yt-dlp -v --simulate "$VIDEO_URL" 2>&1 | grep -E "PO Token Providers|bgutil" || true

      - name: Run Clip Factory
        working-directory: worker
        run: |
          python run.py "$VIDEO_URL" \
            --provider local \
            --count "$COUNT" \
            --min-duration "$MIN_DURATION" \
            --max-duration "$MAX_DURATION"

      - name: Package results
        if: always()
        run: |
          mkdir -p worker/data
          if [ -d worker/data/projects ]; then
            tar -czf "clip-factory-${JOB_ID}.tar.gz" -C worker/data projects
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clip-factory-${{ env.JOB_ID }}
          path: |
            clip-factory-${{ env.JOB_ID }}.tar.gz
            worker/data/projects/**/result.json
          if-no-files-found: warn
          retention-days: 3
