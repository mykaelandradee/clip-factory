name: Clip Factory Worker

run-name: Clip Factory ${{ github.event.client_payload.job_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL"
        required: true
        type: string
      count:
        description: "Number of clips"
        required: false
        default: "5"
        type: string
      min_duration:
        description: "Minimum clip duration in seconds"
        required: false
        default: "20"
        type: string
      max_duration:
        description: "Maximum clip duration in seconds"
        required: false
        default: "60"
        type: string
      subtitle_language:
        description: "Subtitle language"
        required: false
        default: "original"
        type: string
      caption_style:
        description: "Caption style"
        required: false
        default: "karaoke"
        type: string
  repository_dispatch:
    types: [clip-factory-job]

permissions:
  contents: read
  actions: read

concurrency:
  group: clip-factory-worker-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLIP_FACTORY_DATA_DIR: ${{ github.workspace }}/worker/data
      WHISPER_MODEL: small
      RENDER: "false"
      JOB_ID: ${{ github.event.client_payload.job_id || github.run_id }}
      VIDEO_URL: ${{ github.event.client_payload.url || inputs.url }}
      COUNT: ${{ github.event.client_payload.count || inputs.count || '5' }}
      MIN_DURATION: ${{ github.event.client_payload.min_duration || inputs.min_duration || '20' }}
      MAX_DURATION: ${{ github.event.client_payload.max_duration || inputs.max_duration || '60' }}
      SUBTITLE_LANGUAGE: ${{ github.event.client_payload.subtitle_language || inputs.subtitle_language || 'original' }}
      CAPTION_STYLE: ${{ github.event.client_payload.caption_style || inputs.caption_style || 'karaoke' }}
      BGUTIL_POT_URL: http://127.0.0.1:4416

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl unzip ca-certificates libgomp1 openssl fonts-dejavu

      - name: Install YouTube cookie file
        env:
          YOUTUBE_COOKIES_PASSWORD: ${{ secrets.YOUTUBE_COOKIES_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${YOUTUBE_COOKIES_PASSWORD:-}" || { echo "YOUTUBE_COOKIES_PASSWORD is not configured"; exit 1; }
          test -f secrets/youtube_cookies.enc.b64 || { echo "Encrypted YouTube cookie file is missing"; exit 1; }
          COOKIE_ENC="$RUNNER_TEMP/youtube_cookies.enc"
          base64 --decode secrets/youtube_cookies.enc.b64 > "$COOKIE_ENC"
          chmod 600 "$COOKIE_ENC"
          mkdir -p "$RUNNER_TEMP/clip-factory-secrets"
          COOKIE_FILE="$RUNNER_TEMP/clip-factory-secrets/youtube_cookies.txt"
          printf '%s' "$YOUTUBE_COOKIES_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -pass stdin -in "$COOKIE_ENC" -out "$COOKIE_FILE"
          chmod 600 "$COOKIE_FILE"
          rm -f "$COOKIE_ENC"
          echo "YouTube cookie file installed for this job"
          echo "YOUTUBE_COOKIE_FILE=$COOKIE_FILE" >> "$GITHUB_ENV"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Verify Deno
        run: |
          set -euo pipefail
          deno --version

      - name: Install YouTube PO token provider
        run: |
          set -e
          git clone --depth 1 --branch 2.0.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          cd "$RUNNER_TEMP/bgutil-ytdlp-pot-provider/server"
          deno install --allow-scripts=npm:canvas --frozen
          nohup deno run --allow-env --allow-net --allow-ffi=. --allow-read=. src/main.ts --host 127.0.0.1 --port 4416 > "$RUNNER_TEMP/bgutil-provider.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bgutil-provider.pid"
          for i in {1..30}; do
            if curl -fsS "$BGUTIL_POT_URL/ping" >/dev/null 2>&1; then
              echo "bgutil provider is ready at $BGUTIL_POT_URL"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "bgutil provider did not become ready"
              cat "$RUNNER_TEMP/bgutil-provider.log"
              exit 1
            fi
            sleep 1
          done
          pgrep -af "bgutil|src/main.ts" || true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.txt
          python -m pip install -U "yt-dlp[default]" yt-dlp-ejs bgutil-ytdlp-pot-provider

      - name: Verify yt-dlp and PO token provider
        run: |
          set -o pipefail
          test -s "$YOUTUBE_COOKIE_FILE" || { echo "YouTube cookie file is missing or empty"; exit 1; }
          ffmpeg -version | head -n 1
          yt-dlp -v \
            --js-runtimes deno \
            --remote-components ejs:npm \
            --simulate \
            --cookies "$YOUTUBE_COOKIE_FILE" \
            "$VIDEO_URL" 2>&1 | tee "$RUNNER_TEMP/ytdlp-provider-check.log"

      - name: Run Clip Factory
        working-directory: worker
        env:
          YT_DLP_POT_PROVIDER_URL: http://127.0.0.1:4416
          YOUTUBE_COOKIES_FILE: ${{ env.YOUTUBE_COOKIE_FILE }}
        run: |
          python run.py "$VIDEO_URL" --provider local --count "$COUNT" --min-duration "$MIN_DURATION" --max-duration "$MAX_DURATION" --subtitle-language "$SUBTITLE_LANGUAGE" --caption-style "$CAPTION_STYLE"

      - name: Cleanup YouTube cookies
        if: always()
        run: |
          rm -f "${YOUTUBE_COOKIE_FILE:-}"
          rm -rf "$RUNNER_TEMP/clip-factory-secrets"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clip-factory-${{ env.JOB_ID }}
          path: |
            worker/data/projects/**/clip-*.mp4
          if-no-files-found: warn
          retention-days: 3
