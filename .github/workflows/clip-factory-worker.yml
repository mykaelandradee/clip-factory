name: Clip Factory Worker

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL"
        required: true
        type: string
      count:
        description: "Number of clips"
        required: false
        default: "5"
        type: string
      min_duration:
        description: "Minimum clip duration in seconds"
        required: false
        default: "20"
        type: string
      max_duration:
        description: "Maximum clip duration in seconds"
        required: false
        default: "60"
        type: string
  repository_dispatch:
    types: [clip-factory-job]

permissions:
  contents: read
  actions: read

concurrency:
  group: clip-factory-worker-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CLIP_FACTORY_DATA_DIR: ${{ github.workspace }}/worker/data
      WHISPER_MODEL: small
      RENDER: "false"
      JOB_ID: ${{ github.event.client_payload.job_id || github.run_id }}
      VIDEO_URL: ${{ github.event.client_payload.url || inputs.url }}
      COUNT: ${{ github.event.client_payload.count || inputs.count || '5' }}
      MIN_DURATION: ${{ github.event.client_payload.min_duration || inputs.min_duration || '20' }}
      MAX_DURATION: ${{ github.event.client_payload.max_duration || inputs.max_duration || '60' }}
      BGUTIL_POT_URL: http://127.0.0.1:4416

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl unzip ca-certificates libgomp1 openssl

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" --version

      - name: Install YouTube PO token provider
        run: |
          set -e
          git clone --depth 1 --branch 2.0.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          cd "$RUNNER_TEMP/bgutil-ytdlp-pot-provider/server"
          deno install --allow-scripts=npm:canvas --frozen

          nohup deno run \
            --allow-env \
            --allow-net \
            --allow-ffi=. \
            --allow-read=. \
            src/main.ts \
            --host 127.0.0.1 \
            --port 4416 \
            > "$RUNNER_TEMP/bgutil-provider.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/bgutil-provider.pid"

          for i in {1..30}; do
            if curl -fsS "$BGUTIL_POT_URL/ping" >/dev/null 2>&1; then
              echo "bgutil provider is ready at $BGUTIL_POT_URL"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "bgutil provider did not become ready"
              cat "$RUNNER_TEMP/bgutil-provider.log"
              exit 1
            fi
            sleep 1
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.txt
          python -m pip install -U bgutil-ytdlp-pot-provider

      - name: Restore YouTube cookies
        env:
          YOUTUBE_COOKIES_PASSWORD: ${{ secrets.YOUTUBE_COOKIES_PASSWORD }}
        run: |
          set -e
          if [ -z "${YOUTUBE_COOKIES_PASSWORD:-}" ]; then
            echo "YOUTUBE_COOKIES_PASSWORD is not configured"
            exit 1
          fi
          if [ ! -f "secrets/youtube_cookies.enc.b64" ]; then
            echo "Encrypted YouTube cookie file is missing"
            exit 1
          fi

          COOKIE_PATH="$RUNNER_TEMP/youtube_cookies.txt"
          ENCRYPTED_PATH="$RUNNER_TEMP/youtube_cookies.enc"
          trap 'rm -f "$COOKIE_PATH" "$ENCRYPTED_PATH"' EXIT

          base64 --decode secrets/youtube_cookies.enc.b64 > "$ENCRYPTED_PATH"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$ENCRYPTED_PATH" \
            -out "$COOKIE_PATH" \
            -pass env:YOUTUBE_COOKIES_PASSWORD

          chmod 600 "$COOKIE_PATH"
          sudo install -d -m 700 /etc/secrets
          sudo install -m 600 "$COOKIE_PATH" /etc/secrets/youtube_cookies.txt
          echo "YouTube cookies restored for this job"

      - name: Verify yt-dlp and PO token provider
        run: |
          set -o pipefail
          echo "--- versions ---"
          ffmpeg -version | head -n 1
          yt-dlp --version
          echo "--- provider ping ---"
          curl -fsS "$BGUTIL_POT_URL/ping"
          echo
          echo "--- yt-dlp provider detection ---"
          yt-dlp -v --simulate --cookies /etc/secrets/youtube_cookies.txt "$VIDEO_URL" 2>&1 | tee "$RUNNER_TEMP/ytdlp-provider-check.log"
          grep -E "PO Token Providers|bgutil:http" "$RUNNER_TEMP/ytdlp-provider-check.log"

      - name: Run Clip Factory
        working-directory: worker
        env:
          YT_DLP_POT_PROVIDER_URL: http://127.0.0.1:4416
        run: |
          python run.py "$VIDEO_URL" \
            --provider local \
            --count "$COUNT" \
            --min-duration "$MIN_DURATION" \
            --max-duration "$MAX_DURATION"

      - name: Package results
        if: always()
        run: |
          sudo rm -f /etc/secrets/youtube_cookies.txt
          rm -f "$RUNNER_TEMP/youtube_cookies.txt" "$RUNNER_TEMP/youtube_cookies.enc"
          mkdir -p worker/data
          if [ -d worker/data/projects ]; then
            tar -czf "clip-factory-${JOB_ID}.tar.gz" -C worker/data projects
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clip-factory-${{ env.JOB_ID }}
          path: |
            clip-factory-${{ env.JOB_ID }}.tar.gz
            worker/data/projects/**/result.json
          if-no-files-found: warn
          retention-days: 3
