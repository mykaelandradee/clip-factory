name: Clip Factory Worker

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL"
        required: true
        type: string
      provider:
        description: "AI provider"
        required: false
        default: "openai"
        type: choice
        options:
          - openai
          - anthropic
          - ollama
      count:
        description: "Number of clips"
        required: false
        default: "5"
        type: string
      min_duration:
        description: "Minimum clip duration in seconds"
        required: false
        default: "20"
        type: string
      max_duration:
        description: "Maximum clip duration in seconds"
        required: false
        default: "60"
        type: string
  repository_dispatch:
    types: [clip-factory-job]

permissions:
  contents: read
  actions: read

concurrency:
  group: clip-factory-worker-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-5.6' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
      CLIP_FACTORY_DATA_DIR: ${{ github.workspace }}/worker/data
      WHISPER_MODEL: small
      RENDER: "false"
      JOB_ID: ${{ github.event.client_payload.job_id || github.run_id }}
      VIDEO_URL: ${{ github.event.client_payload.url || inputs.url }}
      PROVIDER: ${{ github.event.client_payload.provider || inputs.provider || 'openai' }}
      COUNT: ${{ github.event.client_payload.count || inputs.count || '5' }}
      MIN_DURATION: ${{ github.event.client_payload.min_duration || inputs.min_duration || '20' }}
      MAX_DURATION: ${{ github.event.client_payload.max_duration || inputs.max_duration || '60' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl unzip ca-certificates libgomp1
          rm -rf ~/.cache/apt /var/lib/apt/lists/*

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.txt

      - name: Show runner resources
        run: |
          free -h
          df -h
          ffmpeg -version | head -n 1
          yt-dlp --version

      - name: Run Clip Factory
        working-directory: worker
        run: |
          python run.py "$VIDEO_URL" \
            --provider "$PROVIDER" \
            --count "$COUNT" \
            --min-duration "$MIN_DURATION" \
            --max-duration "$MAX_DURATION"

      - name: Package results
        if: always()
        run: |
          mkdir -p worker/data
          if [ -d worker/data/projects ]; then
            tar -czf "clip-factory-${JOB_ID}.tar.gz" -C worker/data projects
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-factory-${{ env.JOB_ID }}
          path: |
            clip-factory-${{ env.JOB_ID }}.tar.gz
            worker/data/projects/**/result.json
          if-no-files-found: warn
          retention-days: 3
