name: One-off UX refinement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: !contains(github.event.head_commit.message, '[ux-bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply UX refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("web/app/page.tsx")
          text = page.read_text()

          old = '''            <div className="cf-results-head">
              <div><div className="cf-section-kicker">04 / OUTPUT</div><h2>Seus clips estão prontos.</h2><p>{job.result.files?.length ?? 0} clips em 9:16, com legendas e prontos para publicar.</p></div>
              <div className="cf-results-head-actions">
                <button type="button" className="cf-button cf-button-secondary" onClick={downloadAllClips} disabled={!job.result.files?.length}>Baixar tudo <b>↓</b></button>
                <button type="button" className="cf-results-new" onClick={startNewGeneration}>+ Novo vídeo</button>
              </div>
            </div>'''
          new = '''            <div className="cf-results-head">
              <div className="cf-results-title">
                <div className="cf-section-kicker">04 / OUTPUT</div>
                <h2>Seus clips estão prontos.</h2>
                <p>{job.result.files?.length ?? 0} clips renderizados em 9:16, hospedados no R2 e prontos para publicar.</p>
              </div>
              <div className="cf-results-head-actions">
                <div className="cf-output-badge"><span /> R2 DIRECT · SEM PROXY VERCEL</div>
                <button type="button" className="cf-button cf-button-secondary" onClick={downloadAllClips} disabled={!job.result.files?.length}>Baixar tudo <b>↓</b></button>
                <button type="button" className="cf-results-new" onClick={startNewGeneration}>+ Novo vídeo</button>
              </div>
            </div>'''
          if old not in text:
              raise SystemExit("results header target not found")
          text = text.replace(old, new, 1)

          old = '''                    <div className="cf-result-info">
                      <div className="cf-result-heading"><strong>Clip {index + 1}</strong><span>{duration === "15-30" ? "15–30s" : duration === "45-90" ? "45–90s" : "30–60s"} · 9:16 · SHORT</span></div>'''
          new = '''                    <div className="cf-result-info">
                      <div className="cf-result-heading">
                        <div className="cf-result-title-row"><strong>Clip {String(index + 1).padStart(2, "0")}</strong><span className="cf-ready-dot">PRONTO</span></div>
                        <span>{duration === "15-30" ? "15–30s" : duration === "45-90" ? "45–90s" : "30–60s"} · 9:16 · SHORT</span>
                      </div>'''
          if old not in text:
              raise SystemExit("result heading target not found")
          text = text.replace(old, new, 1)
          text = text.replace('<video controls preload="metadata" src={source} />', '<video controls playsInline preload="metadata" src={source} />')
          page.write_text(text)

          css = Path("web/app/globals.css")
          css.write_text(css.read_text() + r'''
          
          /* Results UX refinement */
          .cf-results { margin-top: 48px; }
          .cf-results-head { gap: 20px; }
          .cf-results-title { min-width: 0; }
          .cf-results-title h2 { font-size: clamp(26px, 3vw, 34px); }
          .cf-results-title p { max-width: 560px; line-height: 1.5; }
          .cf-results-head-actions { flex-wrap: wrap; justify-content: flex-end; }
          .cf-output-badge {
            display:inline-flex;
            align-items:center;
            gap:7px;
            min-height:32px;
            padding:0 10px;
            border:1px solid #5fe39a24;
            border-radius:999px;
            background:#5fe39a08;
            color:#6eaa88;
            font-size:7px;
            font-weight:900;
            letter-spacing:.1em;
          }
          .cf-output-badge span {
            width:6px;
            height:6px;
            border-radius:50%;
            background:#5fe39a;
            box-shadow:0 0 10px #5fe39a;
          }
          .cf-result-card:first-child { border-color:#ffffff18; }
          .cf-result-card:first-child .cf-clip-number { background:#ffffffeb; color:#09090b; border-color:#fff; }
          .cf-result-heading { min-height:28px; }
          .cf-result-title-row { display:flex; align-items:center; gap:7px; min-width:0; }
          .cf-result-title-row strong { letter-spacing:-.02em; }
          .cf-ready-dot {
            display:inline-flex!important;
            align-items:center;
            gap:4px;
            color:#65c38b!important;
            font-size:6px!important;
            font-weight:900!important;
            letter-spacing:.1em;
          }
          .cf-ready-dot:before {
            content:"";
            width:4px;
            height:4px;
            border-radius:50%;
            background:#5fe39a;
            box-shadow:0 0 8px #5fe39a;
          }
          .cf-download {
            min-height:34px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding:0 11px;
            border:1px solid #ffffff12;
            border-radius:9px;
            background:#ffffff04;
            transition:.2s ease;
          }
          .cf-download:hover { background:#ffffff0a; border-color:#ffffff25; transform:translateY(-1px); }
          .cf-publish-button { background:#ffffff06; }
          .cf-video-wrap { box-shadow:inset 0 0 0 1px #ffffff08; }
          @media(max-width:980px){
            .cf-results-head { align-items:flex-start; }
            .cf-results-head-actions { justify-content:flex-start; }
          }
          @media(max-width:600px){
            .cf-results-head-actions { grid-template-columns:1fr; }
            .cf-output-badge { justify-content:center; }
            .cf-results-head-actions .cf-button-secondary,
            .cf-results-new { width:100%; }
          }
          ''')
          PY

      - name: Commit UX refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/page.tsx web/app/globals.css
          git rm .github/workflows/ux-refinement.yml
          git commit -m "Improve clip results UX [ux-bot]"
          git push
