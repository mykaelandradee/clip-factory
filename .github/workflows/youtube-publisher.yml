name: YouTube Publisher

on:
  repository_dispatch:
    types: [youtube-publish]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      JOB_ID: ${{ github.event.client_payload.job_id }}
      FILE: ${{ github.event.client_payload.file }}
      VIDEO_TITLE: ${{ github.event.client_payload.title }}
      VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
      PUBLISH_AT: ${{ github.event.client_payload.publish_at }}
      ENCRYPTED_REFRESH_TOKEN: ${{ github.event.client_payload.encrypted_refresh_token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      CLIP_FACTORY_TOKEN_ENCRYPTION_KEY: ${{ secrets.CLIP_FACTORY_TOKEN_ENCRYPTION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uploader
        run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 cryptography

      - name: Download Clip Factory artifact
        env:
          GH_TOKEN: ${{ secrets.CLIP_FACTORY_GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p publish
          gh run download \
            --repo "${GITHUB_REPOSITORY}" \
            --name "clip-factory-${JOB_ID}" \
            --dir publish
          FOUND="$(find publish -type f -name "${FILE}" | head -n 1)"
          test -n "${FOUND}"
          cp "${FOUND}" publish/video.mp4

      - name: Upload to YouTube
        run: |
          cat > publish_youtube.py <<'PY'
          import base64
          import hashlib
          import os

          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          def decrypt_token(value: str, secret: str) -> str:
              iv_b64, tag_b64, data_b64 = value.split(".")
              iv = base64.urlsafe_b64decode(iv_b64 + "=" * (-len(iv_b64) % 4))
              tag = base64.urlsafe_b64decode(tag_b64 + "=" * (-len(tag_b64) % 4))
              data = base64.urlsafe_b64decode(data_b64 + "=" * (-len(data_b64) % 4))
              key = hashlib.sha256(secret.encode("utf-8")).digest()
              return AESGCM(key).decrypt(iv, data + tag, None).decode("utf-8")

          refresh_token = decrypt_token(
              os.environ["ENCRYPTED_REFRESH_TOKEN"],
              os.environ["CLIP_FACTORY_TOKEN_ENCRYPTION_KEY"],
          )

          creds = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )

          youtube = build("youtube", "v3", credentials=creds)

          status = {"privacyStatus": "public"}
          publish_at = os.environ.get("PUBLISH_AT", "").strip()
          if publish_at:
              status = {"privacyStatus": "private", "publishAt": publish_at}

          body = {
              "snippet": {
                  "title": os.environ["VIDEO_TITLE"],
                  "description": os.environ.get("VIDEO_DESCRIPTION", ""),
                  "categoryId": "22",
              },
              "status": status,
          }

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=MediaFileUpload(
                  "publish/video.mp4",
                  mimetype="video/mp4",
                  resumable=True,
              ),
          )
          response = request.execute()
          print("YouTube video uploaded:", response["id"])
          PY
          python publish_youtube.py
