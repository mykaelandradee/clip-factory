name: YouTube Publisher

on:
  repository_dispatch:
    types: [youtube-publish]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Clip Factory job ID"
        required: true
        type: string
      file:
        description: "Clip file, e.g. clip-01.mp4"
        required: true
        type: string
      title:
        description: "YouTube title"
        required: true
        type: string
      description:
        description: "YouTube description"
        required: false
        type: string
      publish_at:
        description: "ISO 8601 UTC time; empty = publish now"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
      FILE: ${{ github.event.client_payload.file || inputs.file }}
      VIDEO_TITLE: ${{ github.event.client_payload.title || inputs.title }}
      VIDEO_DESCRIPTION: ${{ github.event.client_payload.description || inputs.description }}
      PUBLISH_AT: ${{ github.event.client_payload.publish_at || inputs.publish_at }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uploader
        run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Download Clip Factory artifact
        env:
          GH_TOKEN: ${{ secrets.CLIP_FACTORY_GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p publish
          gh run download \
            --repo "${GITHUB_REPOSITORY}" \
            --name "clip-factory-${JOB_ID}" \
            --dir publish
          test -f "publish/data/projects/"*"/${FILE}" || true
          FOUND="$(find publish -type f -name "${FILE}" | head -n 1)"
          test -n "${FOUND}"
          cp "${FOUND}" publish/video.mp4

      - name: Upload to YouTube
        run: |
          cat > publish_youtube.py <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          SCOPES = ["https://www.googleapis.com/auth/youtube.upload"]

          creds = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=SCOPES,
          )

          youtube = build("youtube", "v3", credentials=creds)

          status = {"privacyStatus": "public"}
          publish_at = os.environ.get("PUBLISH_AT", "").strip()
          if publish_at:
              status = {"privacyStatus": "private", "publishAt": publish_at}

          body = {
              "snippet": {
                  "title": os.environ["VIDEO_TITLE"],
                  "description": os.environ.get("VIDEO_DESCRIPTION", ""),
                  "categoryId": "22",
              },
              "status": status,
          }

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=MediaFileUpload("publish/video.mp4", mimetype="video/mp4", resumable=True),
          )
          response = request.execute()
          print("YouTube video uploaded:", response["id"])
          PY
          python publish_youtube.py
