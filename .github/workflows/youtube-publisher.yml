name: YouTube Publisher

on:
  repository_dispatch:
    types: [youtube-publish]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      JOB_ID: ${{ github.event.client_payload.job_id }}
      CONNECTION_ID: ${{ github.event.client_payload.connection_id }}
      FILE: ${{ github.event.client_payload.file }}
      VIDEO_TITLE: ${{ github.event.client_payload.title }}
      VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
      PUBLISH_AT: ${{ github.event.client_payload.publish_at }}
      CLIP_FACTORY_PUBLISH_API_KEY: ${{ secrets.CLIP_FACTORY_PUBLISH_API_KEY }}
      CLIP_FACTORY_URL: https://clip-factory-pi.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uploader
        run: pip install google-api-python-client google-auth

      - name: Download Clip Factory artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p publish
          gh run download \
            --repo "${GITHUB_REPOSITORY}" \
            --name "clip-factory-${JOB_ID}" \
            --dir publish
          FOUND="$(find publish -type f -name "${FILE}" | head -n 1)"
          test -n "${FOUND}"
          cp "${FOUND}" publish/video.mp4

      - name: Validate publisher configuration
        run: |
          test -n "${CLIP_FACTORY_PUBLISH_API_KEY}"
          test -n "${JOB_ID}"
          test -n "${CONNECTION_ID}"
          test -n "${FILE}"
          test -n "${VIDEO_TITLE}"

      - name: Upload to YouTube
        run: |
          cat > publish_youtube.py <<'PY'
          import json
          import os
          import urllib.request

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          api_key = os.environ["CLIP_FACTORY_PUBLISH_API_KEY"]
          endpoint = os.environ["CLIP_FACTORY_URL"].rstrip("/") + "/api/youtube/publish-credential"

          request = urllib.request.Request(
              endpoint,
              data=json.dumps({
                  "job_id": os.environ["JOB_ID"],
                  "connection_id": os.environ["CONNECTION_ID"],
              }).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}",
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              credential = json.load(response)

          access_token = credential["access_token"]
          creds = Credentials(
              token=access_token,
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )
          youtube = build("youtube", "v3", credentials=creds)

          status = {"privacyStatus": "public"}
          publish_at = os.environ.get("PUBLISH_AT", "").strip()
          if publish_at:
              status = {"privacyStatus": "private", "publishAt": publish_at}

          body = {
              "snippet": {
                  "title": os.environ["VIDEO_TITLE"],
                  "description": os.environ.get("VIDEO_DESCRIPTION", ""),
                  "categoryId": "22",
              },
              "status": status,
          }

          upload = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=MediaFileUpload(
                  "publish/video.mp4",
                  mimetype="video/mp4",
                  resumable=True,
              ),
          )
          response = upload.execute()
          print("YouTube video uploaded:", response["id"])
          PY
          python publish_youtube.py
