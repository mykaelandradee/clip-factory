name: Influencer Manager Publisher

on:
  schedule:
    - cron: "* * * * *"
      timezone: "America/Cuiaba"
  workflow_dispatch:

concurrency:
  group: influencer-manager-publisher
  cancel-in-progress: false

jobs:
  publish-influencer-content:
    runs-on: ubuntu-latest
    steps:
      - name: Processar publicações automáticas
        env:
          CLIP_FACTORY_WEB_URL: ${{ secrets.CLIP_FACTORY_WEB_URL }}
          CLIP_FACTORY_SCHEDULER_TOKEN: ${{ secrets.CLIP_FACTORY_SCHEDULER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLIP_FACTORY_WEB_URL"
          test -n "$CLIP_FACTORY_SCHEDULER_TOKEN"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 300             --request POST             --header "Content-Type: application/json"             --header "x-clip-factory-scheduler-token: $CLIP_FACTORY_SCHEDULER_TOKEN"             --data '{"action":"scheduler"}'             "$CLIP_FACTORY_WEB_URL/api/influencer/publish"
